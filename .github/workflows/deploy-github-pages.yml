name: Deploy GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            DEPLOY_BASE_URL: https://outlook-auto-reply-automater.harrybin.de
            VITE_BASE_PATH: /
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Verify lockfile is up to date
              run: |
                  ORIGINAL_LOCKFILE=$(mktemp)
                  BEFORE=$(mktemp)
                  AFTER=$(mktemp)
                  trap 'rm -f "$ORIGINAL_LOCKFILE" "$BEFORE" "$AFTER"' EXIT
                  cp package-lock.json "$ORIGINAL_LOCKFILE"
                  jq -S -c 'del(.version, .packages[""].version)' package-lock.json > "$BEFORE"
                  npm install --package-lock-only
                  jq -S -c 'del(.version, .packages[""].version)' package-lock.json > "$AFTER"
                  if ! cmp -s "$BEFORE" "$AFTER"; then
                    echo "::error::package-lock.json is stale. Run 'npm install' locally and commit the updated lockfile."
                    exit 1
                  fi
                  mv "$ORIGINAL_LOCKFILE" package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build web assets
              run: npm run build:ci

            - name: Create deployment bundle
              run: npm run pack -- "$DEPLOY_BASE_URL"

            - name: Set Pages custom domain
              run: echo "outlook-auto-reply-automater.harrybin.de" > dist/deployment/web/CNAME

            - name: Upload manifest artifact
              uses: actions/upload-artifact@v4
              with:
                  name: outlook-addin-manifest
                  path: dist/deployment/manifest.json

            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist/deployment/web

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4

    release:
        needs: deploy
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Download manifest artifact
              uses: actions/download-artifact@v4
              with:
                  name: outlook-addin-manifest
                  path: dist/deployment

            - name: Read release version
              id: version
              run: echo "value=v$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"

            - name: Write release notes
              run: |
                  cat <<'EOF' > release-notes.md
                  ## ⬇️ Install the Add-in

                  The latest production manifest is always available directly from the hosted deployment:

                  [📥 Download manifest.json](https://outlook-auto-reply-automater.harrybin.de/manifest.json)

                  ### How to install in Outlook

                  1. Click the download link above and save `manifest.json` to your computer.
                  2. Open **Outlook** (desktop or web).
                  3. Go to **Get Add-ins** / **Apps** (or **Manage Add-ins** in Outlook on the web).
                  4. Choose **My add-ins** → **Add a custom add-in** → **Add from file…**
                  5. Select the downloaded `manifest.json`.
                  6. The **Auto-Reply Automater** add-in will appear in your Outlook ribbon or Apps menu.

                  > **Note:** This hosted manifest is generated from the root `manifest.json` during deployment and points to `https://outlook-auto-reply-automater.harrybin.de` — no local server required.
                  EOF

            - name: Create or update release
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ steps.version.outputs.value }}
              run: |
                  if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                    gh release edit "$RELEASE_TAG" \
                      --title "$RELEASE_TAG" \
                      --notes-file release-notes.md \
                      --latest
                    gh release upload "$RELEASE_TAG" dist/deployment/manifest.json --clobber
                  else
                    gh release create "$RELEASE_TAG" dist/deployment/manifest.json \
                      --title "$RELEASE_TAG" \
                      --notes-file release-notes.md \
                      --latest
                  fi
