name: Validate lockfile

on:
    pull_request:
        paths:
            - package.json
            - package-lock.json
    push:
        branches: [main]
        paths:
            - package.json
            - package-lock.json

jobs:
    lockfile:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Verify lockfile is up to date
              run: |
                  ORIGINAL_LOCKFILE=$(mktemp)
                  BEFORE=$(mktemp)
                  AFTER=$(mktemp)
                  trap 'rm -f "$ORIGINAL_LOCKFILE" "$BEFORE" "$AFTER"' EXIT
                  cp package-lock.json "$ORIGINAL_LOCKFILE"
                  jq -S -c 'del(.version, .packages[""].version)' package-lock.json > "$BEFORE"
                  npm install --package-lock-only
                  jq -S -c 'del(.version, .packages[""].version)' package-lock.json > "$AFTER"
                  if ! cmp -s "$BEFORE" "$AFTER"; then
                    echo "::error::package-lock.json is stale. Run 'npm install' locally and commit the updated lockfile."
                    exit 1
                  fi
                  mv "$ORIGINAL_LOCKFILE" package-lock.json
